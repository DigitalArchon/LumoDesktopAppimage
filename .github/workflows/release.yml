name: Release

# Builds a tag's AppImage with packaging/build-appimage.sh, the same script anyone can run to
# rebuild it (the build is reproducible), and opens a draft release with the AppImage, its
# .sha256 and its .zsync, attested: a signed record that this workflow built these bytes from
# this commit. The draft is published by hand, once a build of the same tag on another machine
# has given the same checksum. AppImage updaters read the latest published release's .zsync.
#
# Started three ways: by upstream-watch.yml (workflow_call), after it pins a new upstream version
# and tags it; by pushing a tag v<version>-<release> (a packaging fix: RELEASE raised in
# packaging/upstream.env, committed, tagged); or by hand (Actions → Release → Run workflow),
# which only builds and puts the checksum on the run's summary page.
#
# Actions are pinned by commit, as every input to the build is by checksum.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The tag to build and release
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      appimage: ${{ steps.build.outputs.appimage }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      # The tag being released: the caller's input, or the pushed tag. None when run by hand
      # on a branch, which builds and releases nothing.
      - name: Which tag
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:+refs/tags/$tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref || github.sha }}
          persist-credentials: false

      # Rootless Podman comes with the runner image; the builder image, the toolchains and
      # Proton's commit are fetched by the script, every one pinned.
      - name: Build
        id: build
        run: |
          podman --version
          packaging/build-appimage.sh build
          appimage="$(cd dist && ls Lumo-*-x86_64.AppImage)"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          . packaging/upstream.env
          # Proton's changelog for this version, for the release notes
          git --git-dir="$HOME/.cache/lumo-appimage/upstream.git" show "$UPSTREAM_COMMIT:changelog.md" \
            | awk -v head="## [$UPSTREAM_VERSION]" '$0 == head {p = 1; next} p && /^## \[/ {exit} p' \
            > dist/upstream-changes.md
          {
            echo "### $appimage"
            echo
            echo "Packaging \`$(git rev-parse HEAD)\`, upstream [\`${UPSTREAM_COMMIT:0:12}\`]($UPSTREAM_REPO/commit/$UPSTREAM_COMMIT)"
            echo
            echo '```'
            cat "dist/$appimage.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: |
            dist/Lumo-*-x86_64.AppImage*
            dist/upstream-changes.md
          if-no-files-found: error
          retention-days: 7

  release:
    if: needs.build.outputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # the short-lived signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage
          path: dist

      # The tag names the version the AppImage says it is, or nothing is released.
      - name: Tag matches the version
        env:
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          expected="Lumo-${TAG#v}-x86_64.AppImage"
          if [ "$APPIMAGE" != "$expected" ]; then
            echo "tag $TAG built $APPIMAGE, expected $expected" >&2
            exit 1
          fi
          (cd dist && sha256sum -c "$APPIMAGE.sha256")

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.appimage }}

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          version="${TAG#v}"
          {
            echo "Unofficial AppImage of Proton's Lumo Desktop ${version%-*} (packaging release ${version##*-}),"
            echo "built from Proton's source with no changes to Proton's code. See the README for what it"
            echo "needs and how it differs from Proton's .deb/.rpm."
            echo
            echo "## Changes in Lumo ${version%-*} (from Proton's changelog)"
            if grep -q '[^[:space:]]' dist/upstream-changes.md; then
              cat dist/upstream-changes.md
            else
              echo
              echo "Proton's changelog has no entry for ${version%-*}."
            fi
            echo
            echo "## Checking the download"
            echo
            echo '```'
            cat "dist/$APPIMAGE.sha256"
            echo '```'
            echo
            echo "Built by GitHub Actions from \`$TAG\` and attested. With GitHub CLI 2.49 or newer:"
            echo
            echo '```'
            echo "gh attestation verify $APPIMAGE --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Or rebuild it: check out \`$TAG\`, run \`packaging/build-appimage.sh build\` (it needs"
            echo "rootless Podman; see the README), and compare the checksum. The build is reproducible."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Lumo ${version%-*} (unofficial AppImage, release ${version##*-})" --notes-file notes.md \
            "dist/$APPIMAGE" "dist/$APPIMAGE.sha256" "dist/$APPIMAGE.zsync"
